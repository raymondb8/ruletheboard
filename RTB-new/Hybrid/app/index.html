<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0E387D" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Search Console ownership verification (Settings > Ownership verification > HTML tag) -->
    <meta name="google-site-verification" content="Ks26UTEoyu8TOei1BkhLMBYJbpfAuXs1XB6Dyin0g1M" />

    <!--
      Everything between the SEO markers is REPLACED PER ROUTE by
      scripts/prerender.mjs after `vite build`. Don't hand-edit the tags below
      to change page copy — edit src/seo/pages.json, which both the prerender
      script and src/components/Seo.tsx read. What's here is the homepage
      version, which is what `vite dev` and any un-prerendered build serve.
      Structured data (Organization, WebSite, WebPage, breadcrumbs, FAQs, and so
      on) is generated per page by src/seo/schema.ts and lands in this block
      too; in `vite dev` it's added by <Seo /> after the first render.
    -->
    <!-- SEO:START -->
    <title>Rule the Board | Chess Scholarships for Kids in Atlanta</title>
    <meta
      name="description"
      content="Coaching, a chess set of their own, and paid entries to rated tournaments, for students in grades 3-8 from underserved communities in Atlanta."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ruletheboard.org/" />
    <meta property="og:site_name" content="Rule the Board" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Rule the Board | Chess Scholarships for Kids in Atlanta" />
    <meta
      property="og:description"
      content="Coaching, a chess set of their own, and paid entries to rated tournaments, for students in grades 3-8 from underserved communities in Atlanta."
    />
    <meta property="og:url" content="https://ruletheboard.org/" />
    <meta property="og:image" content="https://ruletheboard.org/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rule the Board | Chess Scholarships for Kids in Atlanta" />
    <meta
      name="twitter:description"
      content="Coaching, a chess set of their own, and paid entries to rated tournaments, for students in grades 3-8 from underserved communities in Atlanta."
    />
    <meta name="twitter:image" content="https://ruletheboard.org/og-image.jpg" />
    <!-- SEO:END -->

    <!--
      Text faces are self-hosted (see src/index.css). Preloading the two latin
      files here, rather than waiting for the stylesheet to request them, gets
      the brand fonts in before first paint. Vite rewrites these hrefs to the
      hashed /assets/ paths at build time. `crossorigin` is required even for
      same-origin fonts, or the browser fetches them twice.
    -->
    <link rel="preload" href="/src/assets/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
